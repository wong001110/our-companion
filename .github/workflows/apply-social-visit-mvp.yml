name: Apply Social Visit MVP

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/electron/main/network/visitService.ts'
      - 'apps/desktop/renderer/src/features/social/SocialVisitConversation.tsx'
      - 'docs/SOCIAL_VISIT_MVP_CHECKLIST.md'
      - '.github/agent/apply-social-visit-mvp.py'
      - '.github/agent/fix-social-visit-typecheck.py'
      - '.github/agent/fix-social-visit-compatibility.py'
      - '.github/workflows/apply-social-visit-mvp.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply audited integration patch
        run: python .github/agent/apply-social-visit-mvp.py
      - name: Apply type narrowing and completion fixes
        run: python .github/agent/fix-social-visit-typecheck.py
      - name: Preserve legacy Visit compatibility
        run: python .github/agent/fix-social-visit-compatibility.py
      - run: npm run arch:check
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: social-visit-typecheck-diagnostics
          path: typecheck.log
      - name: Fail on typecheck error
        if: steps.typecheck.outcome == 'failure'
        run: cat typecheck.log && exit 1
      - name: Test
        id: test
        continue-on-error: true
        run: npm run test > test.log 2>&1
      - name: Upload test diagnostics
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: social-visit-test-diagnostics
          path: test.log
      - name: Fail on test error
        if: steps.test.outcome == 'failure'
        run: cat test.log && exit 1
      - run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate companion social visit MVP"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
