name: Apply Social Network Compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/social-network-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-network-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-social-network-compatibility.py
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run arch:check
      - run: npm run build
      - name: Remove one-time integration files
        run: |
          rm scripts/apply-social-network-compatibility.py
          rm .github/workflows/apply-social-network-compatibility.yml
      - name: Commit compatibility guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve rolling Network compatibility"
          git push origin HEAD:agent/social-network-performance
