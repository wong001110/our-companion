name: Discovery Memory privacy refinement

on:
  push:
    branches: [agent/discovery-memory-integration]
    paths:
      - scripts/refine-discovery-memory-privacy.mjs
      - .github/workflows/discovery-memory-privacy.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-memory-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: node scripts/refine-discovery-memory-privacy.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run packages/discovery-engine/src/discoveryMemory.test.ts
      - run: npm test
      - run: npm run arch:check
      - run: npm run build
      - name: Commit validated refinement
        run: |
          rm -f scripts/refine-discovery-memory-privacy.mjs
          rm -f .github/workflows/discovery-memory-privacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep discovery memory signals private"
          git push origin HEAD:agent/discovery-memory-integration
