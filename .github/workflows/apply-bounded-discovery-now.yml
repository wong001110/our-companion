name: Apply bounded Discovery patch now

on:
  push:
    branches: [agent/fix-plain-turn-output]
    paths:
      - '.github/workflows/apply-bounded-discovery-now.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - name: Apply the checked-in patch and push it
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-bounded-discovery-search.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(dedent(workflow[start:end]), 'bounded-discovery-integration', 'exec'))
          PY
          rm .github/workflows/apply-bounded-discovery-search.yml
          rm .github/workflows/retry-bounded-discovery-integration.yml
          rm .github/workflows/apply-bounded-discovery-now.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: bound Discovery retries and prefilter repeats"
          git push origin HEAD:agent/fix-plain-turn-output
