name: Apply Research test import

on:
  push:
    branches:
      - agent/fix-plain-turn-output
    paths:
      - scripts/add-research-test-url-import.py
      - .github/workflows/run-research-test-import.yml
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-plain-turn-output' || github.ref_name == 'agent/fix-plain-turn-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - run: python scripts/add-research-test-url-import.py
      - run: |
          rm scripts/add-research-test-url-import.py
          rm .github/workflows/run-research-test-import.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: import Discovery URL normalization"
          git push origin HEAD:agent/fix-plain-turn-output
