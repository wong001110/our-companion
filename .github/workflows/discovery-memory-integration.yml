name: Discovery Memory integration

on:
  push:
    branches: [agent/discovery-memory-integration]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-memory-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - name: Apply integration wiring
        run: node scripts/apply-discovery-memory-integration.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: Run Discovery Memory tests
        run: npx vitest run packages/discovery-engine/src/discoveryMemory.test.ts
      - name: Run all tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee discovery-memory-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-memory-test-log
          path: discovery-memory-test.log
          if-no-files-found: ignore
      - run: npm run arch:check
      - run: npm run build
      - name: Commit validated integration
        shell: bash
        run: |
          rm -f .github/workflows/discovery-memory-integration.yml
          rm -f scripts/apply-discovery-memory-integration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate discovery with memory"
          git push origin HEAD:agent/discovery-memory-integration
