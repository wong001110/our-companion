name: Run bounded Discovery patch

on:
  push:
    branches:
      - agent/fix-plain-turn-output
    paths:
      - scripts/apply-bounded-discovery-patch.py
      - .github/workflows/run-bounded-discovery-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - run: python scripts/apply-bounded-discovery-patch.py
      - run: |
          rm -f .github/workflows/apply-bounded-discovery-search.yml
          rm -f .github/workflows/retry-bounded-discovery-integration.yml
          rm -f .github/workflows/apply-bounded-discovery-now.yml
          rm -f .github/workflows/run-bounded-discovery-patch.yml
          rm -f scripts/apply-bounded-discovery-patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: bound Discovery retries and prefilter repeats"
          git push origin HEAD:agent/fix-plain-turn-output
