name: Apply Social Visit Follow-up Fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/fix-social-visit-followup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-social-visit-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply follow-up fixes
        run: |
          python3 scripts/social-visit-followup/fix-anchor.py
          python3 scripts/social-visit-followup/apply.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run arch:check
      - run: npm run build
      - name: Remove integration scaffolding
        run: rm -rf .github/workflows/apply-social-visit-followup.yml scripts/social-visit-followup
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete Social Visit follow-up"
          git push origin HEAD:agent/fix-social-visit-followup
