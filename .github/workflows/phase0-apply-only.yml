name: Apply Phase 0 finalizer patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-apply-only.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/phase0-finalize.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase0-apply-only.yml \
            .github/workflows/phase0-finalize-direct.yml \
            .github/workflows/phase0-finalize.yml \
            scripts/phase0-finalize.mjs
          git add -A
          git commit -m "fix: close phase 0 lifecycle admission"
          git push origin HEAD:main
