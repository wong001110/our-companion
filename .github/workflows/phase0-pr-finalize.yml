name: Phase 0 controlled finalizer

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - .phase0-finalize-trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted same-repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded Phase 0 repair
        run: node scripts/phase0-finalize.mjs
      - name: Remove one-shot bootstrap files
        run: |
          rm -f .phase0-finalize-trigger
          rm -f .phase0-finalizer-trigger
          rm -f scripts/phase0-finalize.mjs
          rm -f .github/workflows/phase0-finalize.yml
          rm -f .github/workflows/phase0-finalize-direct.yml
          rm -f .github/workflows/phase0-apply-only.yml
          rm -f .github/workflows/phase0-pr-finalize.yml
          rm -f .github/workflows/phase0-pr-finalizer.yml
      - name: Commit repair to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close phase 0 lifecycle admission"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
