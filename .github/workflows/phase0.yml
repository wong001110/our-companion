name: Phase 0 validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee phase0-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-test-log
          path: phase0-test.log
          if-no-files-found: ignore
      - run: npm run arch:check
      - run: npm run build
