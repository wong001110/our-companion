name: Remove private planning directories

on:
  push:
    branches: [cleanup/remove-private-material]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-private-material
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove tracked private directories
        run: git rm -r -- .mimocode tasks volumes
      - name: Commit directory cleanup
        run: |
          rm -f .github/workflows/remove-private-material-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove private planning directories"
          git push origin HEAD:cleanup/remove-private-material
