name: Remove interview guide README link

on:
  push:
    branches: [cleanup/remove-private-material]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-private-material
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove README link
        run: sed -i '/Interview guide/d' README.md
      - name: Commit README cleanup
        run: |
          rm -f .github/workflows/remove-interview-guide-readme-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove interview guide link"
          git push origin HEAD:cleanup/remove-private-material
