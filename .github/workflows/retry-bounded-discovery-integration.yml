name: Retry bounded Discovery integration

on:
  push:
    branches: [agent/fix-plain-turn-output]
    paths:
      - '.github/workflows/retry-bounded-discovery-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the checked-in integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-bounded-discovery-search.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          patch = dedent(workflow[start:end])
          exec(compile(patch, 'bounded-discovery-integration', 'exec'))
          PY
          rm .github/workflows/apply-bounded-discovery-search.yml
          rm .github/workflows/retry-bounded-discovery-integration.yml
      - run: npm ci
      - name: Run targeted Discovery and turn tests
        run: >-
          npx vitest run
          apps/desktop/electron/main/discoverySearchGuard.test.ts
          apps/desktop/electron/main/discoveryPresentation.test.ts
          apps/desktop/electron/main/researchOrchestrator.test.ts
          apps/desktop/electron/main/application/CompanionTurnOrchestrator.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run arch:check
      - run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: bound Discovery retries and prefilter repeats"
          git push origin HEAD:agent/fix-plain-turn-output
