name: Productization typecheck diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  typecheck:
    if: github.event.pull_request.head.ref == 'agent/productize-memory-and-proactive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: npm ci
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > productization-typecheck.log 2>&1
          status=$?
          cat productization-typecheck.log
          exit "$status"
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: productization-typecheck-log
          path: productization-typecheck.log
          if-no-files-found: error
