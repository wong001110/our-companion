name: Apply conversation and discovery repairs

on:
  push:
    branches: [agent/fix-plain-turn-output]
    paths:
      - '.github/workflows/fix-plain-turn-output.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/fix-plain-turn-output' || github.ref_name == 'agent/fix-plain-turn-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch conversation and Discovery behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              if old not in content:
                  raise SystemExit(f'{label} anchor not found in {path}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          orchestrator_path = 'apps/desktop/electron/main/application/CompanionTurnOrchestrator.ts'
          source_anchor = """function sourceFor(input: CompanionTurnInput['source']): CompanionMessageSource {
            return input === 'panel_text' ? 'panel' : input;
          }
          """
          source_replacement = source_anchor + """
          /**
           * Preserve an ordinary conversational provider reply when structured JSON
           * was not returned. This never infers Actions or Memory, and the wrapped
           * text still passes the normal grounding and OOC gates below.
           */
          export function proposalFromPlainConversation(text: string): CompanionTurnProposal | undefined {
            const trimmed = text.trim();
            if (!trimmed || trimmed.length > MAX_RENDERED_REPLY_CHARACTERS) return undefined;
            const looksStructured = /^(?:\\{|\\[)/.test(trimmed)
              || /^```(?:json)?\\s*[\\r\\n]+\\s*(?:\\{|\\[)/i.test(trimmed)
              || /\"(?:replySegments|intent|actions|memoryCandidates)\"\\s*:/i.test(trimmed)
              || /<\\/?(?:tool_call|system|developer)>|\"tool_name\"\\s*:/i.test(trimmed);
            if (looksStructured) return undefined;
            return {
              replySegments: [{ segmentId: 'provider_plain_text', text: trimmed, provenance: 'current_turn' }],
              intent: 'conversation',
              actions: [],
              memoryCandidates: [],
            };
          }
          """
          replace_once(orchestrator_path, source_anchor, source_replacement, 'plain reply helper')

          old_parse = """        const structured = validateCompanionTurnProposal(ai.content);
                  proposal = structured ?? this.safeProposal(this.fallbackReply(), 'conversation');
                  inspection.aiStructuredResult = redactSensitiveValue(structured) as CompanionTurnProposal;
                  if (!structured) inspection.finalReplySource = 'safe_fallback';
          """
          new_parse = """        const structured = validateCompanionTurnProposal(ai.content);
                  const plainConversation = structured ? undefined : proposalFromPlainConversation(ai.content);
                  proposal = structured ?? plainConversation ?? this.safeProposal(this.fallbackReply(), 'conversation');
                  inspection.aiStructuredResult = redactSensitiveValue(structured) as CompanionTurnProposal;
                  if (!structured && !plainConversation) inspection.finalReplySource = 'safe_fallback';
          """
          replace_once(orchestrator_path, old_parse, new_parse, 'plain reply parse')

          test_path = Path('apps/desktop/electron/main/application/CompanionTurnOrchestrator.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          start_marker = "  it('falls back when structured output is malformed'"
          end_marker = "  it('redacts sensitive values from retained turn inspection"
          start = tests.find(start_marker)
          end = tests.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('turn regression test range not found')
          replacement_tests = """  it('preserves a normal plain-text provider reply when structured JSON is absent', async () => {
            const reply = '晚上好呀！桌宠的陪伴感听起来好有意思。你是在自己做，还是在玩新的桌宠软件？';
            const harness = createHarness(() => reply);
            const result = await harness.orchestrator.handle({ message: '晚上好，聊聊桌宠吧。', source: 'panel_text', characterId: harness.companion.id });
            expect(result).toMatchObject({ kind: 'conversation', message: reply });
            expect(result.actionPlan).toBeUndefined();
            expect(result.remembered).toEqual([]);
            expect(harness.orchestrator.getInspections()[0].finalReplySource).toBe('ai_conversation');
            expect(harness.db.listCompanionMessages({ characterId: harness.companion.id }).at(-1)?.content).toBe(reply);
            harness.db.close();
          });

          it('falls back when provider output looks like malformed structured data', async () => {
            const harness = createHarness(() => '{\"replySegments\": [');
            const result = await harness.orchestrator.handle({ message: 'Tell me something useful.', source: 'panel_text', characterId: harness.companion.id });
            expect(result.kind).toBe('conversation');
            expect(result.message).not.toContain('replySegments');
            expect(harness.orchestrator.getInspections()[0].finalReplySource).toBe('safe_fallback');
            harness.db.close();
          });

          it('still applies the OOC guard to a salvaged plain-text reply', async () => {
            const unsafeReply = 'I am ChatGPT, an AI language model made by OpenAI.';
            const harness = createHarness(() => unsafeReply);
            const result = await harness.orchestrator.handle({ message: 'Who are you?', source: 'panel_text', characterId: harness.companion.id });
            expect(result.message).not.toBe(unsafeReply);
            expect(harness.orchestrator.getInspections()[0]).toMatchObject({
              finalReplySource: 'safe_fallback',
              oocValidation: { passed: false },
            });
            harness.db.close();
          });

          """
          test_path.write_text(tests[:start] + replacement_tests + tests[end:], encoding='utf-8')

          research_path = 'apps/desktop/electron/main/researchOrchestrator.ts'
          deadline_anchor = """function withCycleDeadline<T>(operation: Promise<T>, remainingMs: number): Promise<T> {
            if (remainingMs <= 0) return Promise.reject(new ResearchCycleTimeoutError());
            return new Promise<T>((resolve, reject) => {
              const timer = setTimeout(() => reject(new ResearchCycleTimeoutError()), remainingMs);
              operation.then(
                (value) => { clearTimeout(timer); resolve(value); },
                (error) => { clearTimeout(timer); reject(error); }
              );
            });
          }
          """
          deadline_replacement = deadline_anchor + """
          const MAX_CANDIDATE_ATTEMPTS = 3;

          function normalizedTitleKey(value: string): string {
            return value
              .normalize('NFKC')
              .toLocaleLowerCase()
              .replace(/[^\\p{L}\\p{N}]+/gu, ' ')
              .replace(/\\s+/g, ' ')
              .trim();
          }

          function titleLooksSeen(title: string, seenTitleKeys: Set<string>): boolean {
            const key = normalizedTitleKey(title);
            if (!key) return false;
            if (seenTitleKeys.has(key)) return true;
            const compact = key.replace(/\\s/g, '');
            const words = new Set(key.split(' ').filter((word) => word.length >= 3));
            for (const seen of seenTitleKeys) {
              const seenCompact = seen.replace(/\\s/g, '');
              const shorter = compact.length <= seenCompact.length ? compact : seenCompact;
              const longer = compact.length <= seenCompact.length ? seenCompact : compact;
              if (shorter.length >= 12 && longer.includes(shorter) && shorter.length / longer.length >= 0.72) return true;
              const seenWords = seen.split(' ').filter((word) => word.length >= 3);
              if (words.size >= 3 && seenWords.length >= 3) {
                const overlap = seenWords.filter((word) => words.has(word)).length;
                if (overlap / Math.min(words.size, seenWords.length) >= 0.75) return true;
              }
            }
            return false;
          }
          """
          replace_once(research_path, deadline_anchor, deadline_replacement, 'research title filtering helpers')

          old_input = """    seenCanonicalUrls?: Set<string>;
              materialUpdateProbe?: boolean;
          """
          new_input = """    seenCanonicalUrls?: Set<string>;
              seenDiscoveryTitles?: string[];
              seenContentHashes?: Set<string>;
              maxCandidateAttempts?: number;
              materialUpdateProbe?: boolean;
          """
          replace_once(research_path, old_input, new_input, 'research retry input')

          old_seen = """    const historicalSeenUrls = new Set(seenUrls);
              const selectedCanonicalUrlsThisCycle = new Set<string>();
          """
          new_seen = """    const historicalSeenUrls = new Set(seenUrls);
              const seenTitleKeys = new Set((input.seenDiscoveryTitles ?? []).map(normalizedTitleKey).filter(Boolean));
              const seenContentHashes = new Set(input.seenContentHashes ?? []);
              const selectedCanonicalUrlsThisCycle = new Set<string>();
          """
          replace_once(research_path, old_seen, new_seen, 'research seen identities')

          old_unique = """        const uniqueResults = found.filter((result) => !results.some((known) => normalizeDiscoveryUrl(known.url) === normalizeDiscoveryUrl(result.url)));
                  results.push(...uniqueResults);
                  providerOutcomes.push({ id: this.deps.searchProvider.id, providerMode: this.deps.searchProvider.mode, status: uniqueResults.length ? 'completed' : 'empty', itemCount: uniqueResults.length });
                  const searchRecord = { id: createId('research_search'), query, provider: this.deps.searchProvider.id, providerMode: this.deps.searchProvider.mode, status: uniqueResults.length ? 'completed' as const : 'empty' as const, resultCount: uniqueResults.length };
          """
          new_unique = """        const uniqueResults = found.filter((result) => {
                    const canonicalUrl = normalizeDiscoveryUrl(result.url) ?? result.url;
                    if (!input.materialUpdateProbe && seenUrls.has(canonicalUrl)) return false;
                    if (!input.materialUpdateProbe && titleLooksSeen(result.title, seenTitleKeys)) return false;
                    if (results.some((known) => normalizeDiscoveryUrl(known.url) === canonicalUrl)) return false;
                    const titleKey = normalizedTitleKey(result.title);
                    if (titleKey) seenTitleKeys.add(titleKey);
                    return true;
                  });
                  const filteredSeenCount = found.length - uniqueResults.length;
                  results.push(...uniqueResults);
                  providerOutcomes.push({ id: this.deps.searchProvider.id, providerMode: this.deps.searchProvider.mode, status: uniqueResults.length ? 'completed' : 'empty', itemCount: uniqueResults.length });
                  const searchRecord = { id: createId('research_search'), query, provider: this.deps.searchProvider.id, providerMode: this.deps.searchProvider.mode, status: uniqueResults.length ? 'completed' as const : 'empty' as const, resultCount: uniqueResults.length };
          """
          replace_once(research_path, old_unique, new_unique, 'research result prefilter')

          old_payload = """          payload: { query, resultCount: uniqueResults.length, freshnessDays: intent.freshnessDays, durationMs: Date.now() - searchStart },
          """
          new_payload = """          payload: { query, resultCount: uniqueResults.length, filteredSeenCount, freshnessDays: intent.freshnessDays, durationMs: Date.now() - searchStart },
          """
          replace_once(research_path, old_payload, new_payload, 'research debug filtered count')

          replace_once(research_path, "    const fetchPass = async () => {\n", "    const fetchPass = async (attemptsRemaining = 1) => {\n", 'bounded fetch pass signature')

          old_selection = """      const selected = selectResearchPages({
                intent,
                plan: { ...plan, limits: { ...plan.limits, maxPagesToRead: remainingPages } },
          """
          new_selection = """      const passPageLimit = Math.max(1, Math.min(
                remainingPages,
                Math.ceil(remainingPages / Math.max(1, attemptsRemaining))
              ));
              const selected = selectResearchPages({
                intent,
                plan: { ...plan, limits: { ...plan.limits, maxPagesToRead: passPageLimit } },
          """
          replace_once(research_path, old_selection, new_selection, 'per-attempt page budget')

          old_page_commit = """        seenUrls.add(normalizeDiscoveryUrl(boundedPage.canonicalUrl) ?? boundedPage.canonicalUrl);
                  evidence.push(boundedPage);
                  evidenceCharacters += extractedText.length;
          """
          new_page_commit = """        if (seenContentHashes.has(boundedPage.contentHash)) {
                    input.onTrace?.({ operation: 'web-page:deduplicate-content', status: 'skipped', inputRefs: [boundedPage.id], outputRefs: [], skipReason: 'seen_content_hash' });
                    continue;
                  }
                  seenContentHashes.add(boundedPage.contentHash);
                  seenUrls.add(normalizeDiscoveryUrl(boundedPage.canonicalUrl) ?? boundedPage.canonicalUrl);
                  evidence.push(boundedPage);
                  evidenceCharacters += extractedText.length;
          """
          replace_once(research_path, old_page_commit, new_page_commit, 'content hash prefilter')

          old_attempt_block = """    if (canSearch) await Promise.all(plan.queries.slice(0, plan.limits.maxQueries).map(search));
              const fetchPass = async (attemptsRemaining = 1) => {
          """
          if old_attempt_block not in Path(research_path).read_text(encoding='utf-8'):
              raise SystemExit('research attempt start anchor not found')

          old_after_fetch = """    };
              if (canSearch || canFetchBaseUrls) await fetchPass();
              let coverage = evaluateEvidenceCoverage(intent, evidence);
          """
          new_after_fetch = """    };
              const maxCandidateAttempts = Math.max(1, Math.min(
                MAX_CANDIDATE_ATTEMPTS,
                input.maxCandidateAttempts ?? MAX_CANDIDATE_ATTEMPTS,
                plan.limits.maxQueries
              ));
              const attemptQueries = [...new Set([
                ...plan.queries,
                `${intent.topic} alternative approaches`,
                `${intent.topic} recent case studies`,
                `${intent.topic} adjacent perspectives`,
              ])].slice(0, maxCandidateAttempts);
              const provisionalCandidateCount = () => dedupeResearchCandidates([
                ...createDiscoveryCandidatesFromEvidence({
                  userId: input.userId,
                  companionId: input.companionId,
                  curiosityTargetId: input.curiosityTarget.id,
                  researchPlanId: plan.id,
                  evidence,
                }),
                ...structuredCandidates,
              ]).length;
              if (canSearch) {
                for (let attempt = 0; attempt < attemptQueries.length; attempt += 1) {
                  if (provisionalCandidateCount() >= 3) break;
                  const query = attemptQueries[attempt]!;
                  await search(query);
                  await fetchPass(attemptQueries.length - attempt);
                  const candidateCount = provisionalCandidateCount();
                  input.onTrace?.({
                    operation: 'research-candidate-attempt',
                    status: candidateCount >= 3 ? 'completed' : candidateCount ? 'skipped' : 'empty',
                    inputRefs: [plan.id],
                    outputRefs: [],
                    skipReason: candidateCount >= 3 ? undefined : `candidate_count_${candidateCount}`,
                  });
                  if (searchesStarted >= plan.limits.maxQueries || pageFetchesStarted >= plan.limits.maxPagesToRead || remainingMs() <= 0) break;
                }
              } else if (canFetchBaseUrls) {
                await fetchPass(1);
              }
              let coverage = evaluateEvidenceCoverage(intent, evidence);
          """
          replace_once(research_path, old_after_fetch, new_after_fetch, 'bounded candidate attempts')

          services_path = 'apps/desktop/electron/main/services.ts'
          constants_anchor = """export const MAX_COMPANION_ASSET_BYTES = 20 * 1024 * 1024;
          export const MAX_COMPANION_TOTAL_ASSET_BYTES = 200 * 1024 * 1024;
          """
          constants_replacement = constants_anchor + """
          export function buildShortDiscoveryTags(values: Array<string | undefined>, limit = 4): string[] {
            const tags: string[] = [];
            for (const value of values) {
              if (!value) continue;
              for (const part of value.split(/[，,。.!?！？;；|/\\:：—–]+/u)) {
                const normalized = part.replace(/[_-]+/g, ' ').replace(/\\s+/g, ' ').trim();
                if (!normalized) continue;
                const hasHan = /\\p{Script=Han}/u.test(normalized);
                const compact = hasHan
                  ? normalized.slice(0, 8)
                  : normalized.split(' ').filter(Boolean).slice(0, 3).join(' ').slice(0, 28);
                if (compact.length < 2) continue;
                const key = compact.toLocaleLowerCase();
                if (tags.some((tag) => tag.toLocaleLowerCase() === key)) continue;
                tags.push(compact);
                if (tags.length >= limit) return tags;
              }
            }
            return tags;
          }
          """
          replace_once(services_path, constants_anchor, constants_replacement, 'short Discovery tags helper')

          old_research_call = """    cycle = this.saveCycleState(cycle, 'exploring');
              const research = await this.researchOrchestrator.run({
          """
          new_research_call = """    cycle = this.saveCycleState(cycle, 'exploring');
              const seenDiscoveryIdentities = this.db.listDiscoverySeenIdentities(companionId, 1_000);
              const seenContentHashes = new Set(seenDiscoveryIdentities.flatMap((seen) => {
                const contentHash = seen.metadata?.contentHash;
                return typeof contentHash === 'string' && contentHash ? [contentHash] : [];
              }));
              const research = await this.researchOrchestrator.run({
          """
          replace_once(services_path, old_research_call, new_research_call, 'Discovery seen identity preload')

          old_research_args = """      seenCanonicalUrls: new Set(discoveryHistory.map((discovery) => discovery.canonicalUrl ?? discovery.url).filter(Boolean) as string[]),
                materialUpdateProbe: requiresMaterialUpdate,
          """
          new_research_args = """      seenCanonicalUrls: new Set(discoveryHistory.map((discovery) => discovery.canonicalUrl ?? discovery.url).filter(Boolean) as string[]),
                seenDiscoveryTitles: discoveryHistory.map((discovery) => discovery.title),
                seenContentHashes,
                maxCandidateAttempts: 3,
                materialUpdateProbe: requiresMaterialUpdate,
          """
          replace_once(services_path, old_research_args, new_research_args, 'Discovery retry arguments')

          old_tags = """        tags: [selectedCuriosityTarget.topic],
          """
          new_tags = """        tags: buildShortDiscoveryTags([
                  source,
                  sourceCandidate?.sourceName,
                  selectedInsight.title,
                  selectedCuriosityTarget.topic,
                ]),
          """
          replace_once(services_path, old_tags, new_tags, 'short persisted Discovery tags')

          discoveries_page = Path('apps/desktop/renderer/src/pages/DiscoveriesPage.tsx')
          discoveries_page.write_text("""import { useState } from 'react';
          import type { Discovery, ExplorationCycleResult } from '@our-companion/shared';
          import { t } from '../i18n';
          import { InlineNotice } from '../components/feedback/InlineNotice';
          import { useDiscoveriesViewModel } from '../features/discoveries/useDiscoveriesViewModel';
          import { DiscoveryHistoryPanel } from '../features/discoveries/DiscoveryHistoryPanel';
          import { DiscoverySourcesPanel } from '../features/discoveries/DiscoverySourcesPanel';
          import { NotebookPage, StickyNote, useLang } from '../ui/NotebookPrimitives';
          import { formatDiscoveryTime } from '../ui/utils';

          interface DiscoveriesPageProps {
            discoveries: Discovery[];
            exploration?: ExplorationCycleResult;
            exploring: boolean;
            onStartExploration: () => Promise<void>;
            onSubmitFeedback: (value: 'saved' | 'not_interested' | 'later' | 'talk_about_this' | 'opened_evidence') => Promise<void>;
            onRefresh: () => Promise<void>;
          }

          interface DiscoveryDetail {
            title: string;
            summary: string;
            source: string;
            url?: string;
            tags: string[];
          }

          function shortSummary(value: string, maximum = 180): string {
            const normalized = value.replace(/\\s+/g, ' ').trim();
            return normalized.length <= maximum ? normalized : `${normalized.slice(0, maximum - 1).trimEnd()}…`;
          }

          function compactTags(values: string[]): string[] {
            const tags: string[] = [];
            for (const value of values) {
              for (const part of value.split(/[，,。.!?！？;；|/\\:：—–]+/u)) {
                const normalized = part.replace(/[_-]+/g, ' ').replace(/\\s+/g, ' ').trim();
                if (!normalized) continue;
                const compact = /\\p{Script=Han}/u.test(normalized)
                  ? normalized.slice(0, 10)
                  : normalized.split(' ').slice(0, 3).join(' ').slice(0, 30);
                if (compact.length < 2 || tags.some((tag) => tag.toLocaleLowerCase() === compact.toLocaleLowerCase())) continue;
                tags.push(compact);
                if (tags.length >= 4) return tags;
              }
            }
            return tags;
          }

          export function DiscoveriesPage({ discoveries, exploration, exploring, onStartExploration, onSubmitFeedback, onRefresh }: DiscoveriesPageProps) {
            const lang = useLang();
            const [section, setSection] = useState<'feed' | 'sources' | 'history'>('feed');
            const [detail, setDetail] = useState<DiscoveryDetail>();
            const { addToJourney, busy, error, filters, markNotInterested, refreshDiscovery, selectedFilter, setSelectedFilter, visibleDiscoveries } = useDiscoveriesViewModel({ discoveries, lang, onRefresh });
            const detailsLabel = lang === 'zh-CN' ? '查看详情' : 'Details';
            const closeLabel = lang === 'zh-CN' ? '关闭' : 'Close';

            return (
              <NotebookPage eyebrow={t(lang, 'discovery_eyebrow')} title={t(lang, 'discovery_title')} note={t(lang, 'discovery_note')} marker="discovery">
                <div className="soft-filter-row discovery-section-tabs" role="tablist" aria-label={t(lang, 'discovery_sections_label')}>
                  {(['feed', 'sources', 'history'] as const).map((item) => (
                    <button key={item} id={`discovery-tab-${item}`} type="button" role="tab" aria-selected={section === item} aria-controls={`discovery-panel-${item}`} className={section === item ? 'active' : ''} onClick={() => setSection(item)}>
                      {t(lang, `discovery_section_${item}`)}
                    </button>
                  ))}
                </div>
                <div id="discovery-panel-feed" role="tabpanel" aria-labelledby="discovery-tab-feed" hidden={section !== 'feed'}>
                {section === 'feed' && <>
                <div className="toolbar notebook-toolbar">
                  <div className="soft-filter-row" aria-label={t(lang, 'discovery_filters_label')}>
                    {filters.map(({ key, label }) => <button key={key} className={selectedFilter === key ? 'active' : ''} aria-pressed={selectedFilter === key} onClick={() => setSelectedFilter(key)}>{label}</button>)}
                  </div>
                  <div className="action-row">
                    <button onClick={() => void onStartExploration()} disabled={exploring}>{exploring ? t(lang, 'discovery_exploring') : t(lang, 'discovery_send_exploring')}</button>
                    <button disabled={busy} onClick={() => void refreshDiscovery()}>{t(lang, 'discovery_refresh')}</button>
                  </div>
                </div>
                {error && <InlineNotice tone="error">{error}</InlineNotice>}
                {exploration?.selectedInsight && (
                  <section className="insight-archive-panel">
                    <div><p className="eyebrow">{t(lang, 'discovery_returned_insight')}</p><h2>{exploration.selectedInsight.title}</h2><p>{exploration.selectedInsight.summary}</p></div>
                    <div className="action-row">
                      <button onClick={() => void onSubmitFeedback('opened_evidence')}>{t(lang, 'discovery_explore_evidence')}</button>
                      <button onClick={() => void onSubmitFeedback('saved')}>{t(lang, 'discovery_save')}</button>
                      <button onClick={() => void onSubmitFeedback('not_interested')}>{t(lang, 'discovery_not_interested')}</button>
                      <button onClick={() => void onSubmitFeedback('talk_about_this')}>{t(lang, 'discovery_talk_about')}</button>
                    </div>
                    <div className="discovery-grid evidence-grid">
                      {exploration.discoveryCandidates.slice(0, 4).map((candidate) => (
                        <article className="discovery-card discovery-card--evidence paper-photo-card" key={candidate.id}>
                          <div className="card-topline"><span>{candidate.sourceType}</span><strong>{candidate.agentType}</strong></div>
                          <h3>{candidate.title}</h3><p className="discovery-card-summary">{shortSummary(candidate.summary)}</p>
                          <div className="action-row">
                            <button onClick={() => setDetail({ title: candidate.title, summary: candidate.summary, source: candidate.sourceName, url: candidate.sourceUrl, tags: [] })}>{detailsLabel}</button>
                            {candidate.sourceUrl && <button onClick={() => window.ourCompanion.tool.execute({ toolName: 'open_url', args: { url: candidate.sourceUrl } })}>{t(lang, 'discovery_view')}</button>}
                          </div>
                        </article>
                      ))}
                    </div>
                  </section>
                )}
                <div className="discovery-grid">
                  {visibleDiscoveries.map((discovery) => {
                    const summary = discovery.summary ?? discovery.shortMessage ?? t(lang, 'discovery_default_summary');
                    const tags = compactTags(discovery.tags);
                    return (
                      <article className="discovery-card paper-photo-card" key={discovery.id}>
                        <div className="photo-thumb" aria-hidden="true"><span>{discovery.source.slice(0, 2).toUpperCase()}</span></div>
                        <div className="card-topline"><span>{discovery.source}</span><strong>{formatDiscoveryTime(discovery, lang)}</strong></div>
                        <h3>{discovery.title}</h3><p className="discovery-card-summary">{shortSummary(summary)}</p>
                        <div className="tag-row">{tags.map((tag) => <span title={tag} key={tag}>{tag}</span>)}</div>
                        <div className="action-row">
                          <button onClick={() => setDetail({ title: discovery.title, summary, source: discovery.source, url: discovery.url, tags })}>{detailsLabel}</button>
                          <button onClick={() => discovery.url && window.ourCompanion.tool.execute({ toolName: 'open_url', args: { url: discovery.url } })}>{t(lang, 'discovery_view')}</button>
                          <button disabled={busy} onClick={() => void addToJourney(discovery.id)}>{t(lang, 'discovery_add')}</button>
                          <button disabled={busy} onClick={() => void markNotInterested(discovery.id)}>{t(lang, 'discovery_not_interested')}</button>
                        </div>
                      </article>
                    );
                  })}
                  {visibleDiscoveries.length === 0 && <StickyNote title={t(lang, 'discovery_empty_title')}><p>{t(lang, 'discovery_empty_body')}</p></StickyNote>}
                </div>
                </>}
                </div>
                <div id="discovery-panel-sources" role="tabpanel" aria-labelledby="discovery-tab-sources" hidden={section !== 'sources'}>{section === 'sources' && <DiscoverySourcesPanel onFeedRefresh={onRefresh} />}</div>
                <div id="discovery-panel-history" role="tabpanel" aria-labelledby="discovery-tab-history" hidden={section !== 'history'}>{section === 'history' && <DiscoveryHistoryPanel />}</div>
                {detail && (
                  <div className="discovery-detail-backdrop" role="presentation" onMouseDown={(event) => { if (event.target === event.currentTarget) setDetail(undefined); }}>
                    <section className="discovery-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="discovery-detail-title">
                      <div className="card-topline"><span>{detail.source}</span><button type="button" onClick={() => setDetail(undefined)}>{closeLabel}</button></div>
                      <h2 id="discovery-detail-title">{detail.title}</h2>
                      <p>{detail.summary}</p>
                      {detail.tags.length > 0 && <div className="tag-row">{detail.tags.map((tag) => <span key={tag}>{tag}</span>)}</div>}
                      {detail.url && <button onClick={() => window.ourCompanion.tool.execute({ toolName: 'open_url', args: { url: detail.url! } })}>{t(lang, 'discovery_view')}</button>}
                    </section>
                  </div>
                )}
              </NotebookPage>
            );
          }
