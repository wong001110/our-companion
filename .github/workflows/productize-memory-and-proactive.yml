name: Memory and proactive productization

on:
  push:
    branches: [agent/productize-memory-and-proactive]

permissions:
  contents: write

concurrency:
  group: productize-memory-and-proactive
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/productize-memory-and-proactive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply product integration
        run: node scripts/apply-memory-proactive-productization.mjs
      - name: Commit generated implementation
        shell: bash
        run: |
          rm -f .github/workflows/productize-memory-and-proactive.yml
          rm -f scripts/apply-memory-proactive-productization.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: productize memory and proactive behavior"
          git push origin HEAD:agent/productize-memory-and-proactive
