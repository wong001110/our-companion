name: Phase 0 direct finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-finalize-direct.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded lifecycle patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          operation_tracker = Path('apps/desktop/electron/main/application/OperationTracker.ts')
          replace_once(
              operation_tracker,
              "export type OperationKind = 'companion_turn' | 'permission_resolution' | 'speech_transcription' | 'research' | 'discovery' | 'tool_execution' | 'network_reconciliation' | 'visit_reconciliation' | 'debug_flush' | 'embedding_job' | 'vector_search' | 'vector_rebuild' | 'vector_initialization' | 'database_maintenance';",
              "export type OperationKind = 'ipc_request' | 'companion_turn' | 'permission_resolution' | 'speech_transcription' | 'research' | 'discovery' | 'tool_execution' | 'network_reconciliation' | 'visit_reconciliation' | 'debug_flush' | 'embedding_job' | 'vector_search' | 'vector_rebuild' | 'vector_initialization' | 'database_maintenance';",
          )

          gate = Path('apps/desktop/electron/main/application/RuntimeIpcGate.ts')
          gate.write_text("""export type RuntimeIpcOperationRunner = (
            operation: () => unknown | Promise<unknown>,
          ) => Promise<unknown>;

          export type RuntimeIpcHandler = (...args: unknown[]) => unknown | Promise<unknown>;

          /** Admits every renderer IPC request through the application lifecycle tracker. */
          export function guardRuntimeIpcHandler(
            runOperation: RuntimeIpcOperationRunner,
            handler: RuntimeIpcHandler,
          ): RuntimeIpcHandler {
            return (...args: unknown[]) => runOperation(() => handler(...args));
          }
          """, encoding='utf-8')

          gate_test = Path('apps/desktop/electron/main/application/RuntimeIpcGate.test.ts')
          gate_test.write_text("""import fs from 'node:fs';
          import { describe, expect, it, vi } from 'vitest';
          import { OperationTracker } from './OperationTracker';
          import { guardRuntimeIpcHandler } from './RuntimeIpcGate';

          function runner(tracker: OperationTracker) {
            return async (operation: () => unknown | Promise<unknown>): Promise<unknown> => {
              const token = tracker.beginOperation('ipc_request');
              try {
                const result = await operation();
                token.assertCanCommit();
                return result;
              } finally {
                token.finish();
              }
            };
          }

          describe('RuntimeIpcGate', () => {
            it('rejects a renderer request after quiescing before its handler runs', async () => {
              const tracker = new OperationTracker();
              const handler = vi.fn(() => 'ok');
              const guarded = guardRuntimeIpcHandler(runner(tracker), handler);
              tracker.beginQuiescing();
              await expect(guarded()).rejects.toMatchObject({ code: 'APP_SHUTTING_DOWN' });
              expect(handler).not.toHaveBeenCalled();
            });

            it('keeps an admitted request tracked until its asynchronous handler settles', async () => {
              const tracker = new OperationTracker();
              let release!: () => void;
              const guarded = guardRuntimeIpcHandler(runner(tracker), () => new Promise<void>((resolve) => { release = resolve; }));
              const pending = guarded();
              expect(tracker.snapshot()).toMatchObject({ activeOperationCount: 1, activeOperationsByKind: { ipc_request: 1 } });
              release();
              await pending;
              expect(tracker.activeCount()).toBe(0);
            });

            it('is wired at the central Electron route-registration boundary', () => {
              const source = fs.readFileSync(new URL('../index.ts', import.meta.url), 'utf8');
              expect(source).toContain("import { guardRuntimeIpcHandler } from './application/RuntimeIpcGate';");
              expect(source).toContain('(operation) => services.runIpcOperation(operation)');
            });
          });
          """, encoding='utf-8')

          services = Path('apps/desktop/electron/main/services.ts')
          replace_once(
              services,
              """  cleanupFlushTimer(): void {
              this.debugFlushWorker.cleanupFlushTimer();
            }

            private assertRunning(): void {
              this.operationTracker.assertRunning();
            }
""",
              """  cleanupFlushTimer(): void {
              this.debugFlushWorker.cleanupFlushTimer();
            }

            /** Central admission and tracking boundary for all renderer IPC requests. */
            runIpcOperation(operation: () => unknown | Promise<unknown>): Promise<unknown> {
              return this.trackOperation('ipc_request', async () => operation());
            }

            assertRuntimeActive(): void {
              this.operationTracker.assertRunning();
            }

            private assertRunning(): void {
              this.assertRuntimeActive();
            }
""",
          )

          replace_once(
              services,
              """      const settled = await Promise.race([
                Promise.all([
                  this.embeddingJobRunner.stop(),
                  this.vectorIndex.stopAndWait(timeoutMs),
                  this.operationTracker.drain(timeoutMs),
                ]).then(([_, vector]) => vector.settled),
                new Promise<boolean>((resolve) => setTimeout(() => resolve(false), timeoutMs)),
              ]);
              if (!settled) { this.embeddingJobRunner.preventFurtherWrites(); this.vectorIndex.detach(); }
              this.operationTracker.abortRemaining();
              this.operationTracker.beginDisposing();
              this.network.dispose(); this.visits.stopAll(); this.visualVisits.stopAll('app_shutdown');
              await this.localEmbeddings.dispose();
              this.db.close();
              this.operationTracker.markDisposed();
""",
              """      const shutdown = await Promise.race([
                Promise.all([
                  this.embeddingJobRunner.stop(),
                  this.vectorIndex.stopAndWait(timeoutMs),
                  this.operationTracker.drain(timeoutMs),
                ]).then(([_, vector, operations]) => ({
                  vectorSettled: vector.settled,
                  operationsDrained: operations.drained,
                })),
                new Promise<{ vectorSettled: boolean; operationsDrained: boolean }>((resolve) =>
                  setTimeout(() => resolve({ vectorSettled: false, operationsDrained: false }), timeoutMs)),
              ]);
              const fullyDrained = shutdown.vectorSettled && shutdown.operationsDrained;
              if (!fullyDrained) {
                this.operationTracker.abortRemaining();
                this.embeddingJobRunner.preventFurtherWrites();
                this.vectorIndex.detach();
                await this.operationTracker.drain(250);
              } else {
                this.operationTracker.abortRemaining();
              }
              const mayCloseDatabase = this.operationTracker.activeCount() === 0;
              if (!mayCloseDatabase) this.db.beginShutdownReadOnly();
              this.operationTracker.beginDisposing();
              this.network.dispose(); this.visits.stopAll(); this.visualVisits.stopAll('app_shutdown');
              await this.localEmbeddings.dispose();
              if (mayCloseDatabase) this.db.close();
              this.operationTracker.markDisposed();
""",
          )

          index = Path('apps/desktop/electron/main/index.ts')
          text = index.read_text(encoding='utf-8')
          import_line = "import { AppServices } from './services';\n"
          if import_line not in text:
              raise SystemExit('index.ts: AppServices import marker missing')
          text = text.replace(import_line, import_line + "import { guardRuntimeIpcHandler } from './application/RuntimeIpcGate';\n", 1)
          marker = '  for (const [channel, handler] of Object.entries(routes)) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('index.ts: route registration loop missing')
          cursor = start + len(marker)
          depth = 1
          while cursor < len(text) and depth:
              if text[cursor] == '{':
                  depth += 1
              elif text[cursor] == '}':
                  depth -= 1
              cursor += 1
          block = text[start:cursor]
          if 'ipcMain.handle' not in block or len(block) > 1200:
              raise SystemExit(f'index.ts: unexpected route loop: {block[:300]}')
          replacement = """  for (const [channel, handler] of Object.entries(routes)) {
            ipcMain.handle(
              channel,
              guardRuntimeIpcHandler(
                (operation) => services.runIpcOperation(operation),
                (_event, ...args) => (handler as (...handlerArgs: unknown[]) => unknown)(...args),
              ),
            );
          }"""
          index.write_text(text[:start] + replacement + text[cursor:], encoding='utf-8')

          database = Path('packages/database/src/index.ts')
          replace_once(
              database,
              """    this.adaptiveDiscovery = new AdaptiveDiscoveryPersistence(this.db);
            }

            getDiscoverySeenIdentity(
""",
              """    this.adaptiveDiscovery = new AdaptiveDiscoveryPersistence(this.db);
            }

            /** Prevents uncooperative late operations from persisting after shutdown timeout. */
            beginShutdownReadOnly(): void {
              this.embeddingJobNotifier = undefined;
              this.vectorDeletionHandler = undefined;
              this.db.exec('PRAGMA query_only = ON');
            }

            getDiscoverySeenIdentity(
""",
          )

          db_test = Path('packages/database/src/shutdown-readonly.test.ts')
          db_test.write_text("""import { describe, expect, it } from 'vitest';
          import { DatabaseService } from './index';

          describe('DatabaseService shutdown read-only barrier', () => {
            it('keeps reads available but rejects late writes after a drain timeout', () => {
              const db = new DatabaseService();
              db.setAppSetting('before-shutdown', 'value');
              db.beginShutdownReadOnly();
              expect(db.getAppSetting('before-shutdown')).toBe('value');
              expect(() => db.setAppSetting('late-write', 'blocked')).toThrow();
              db.close();
            });
          });
          """, encoding='utf-8')

          lifecycle_test = Path('apps/desktop/electron/main/application/LifecycleWiring.test.ts')
          lifecycle_test.write_text("""import fs from 'node:fs';
          import { describe, expect, it } from 'vitest';

          describe('AppServices lifecycle wiring', () => {
            const source = fs.readFileSync(new URL('../services.ts', import.meta.url), 'utf8');

            it('requires both vector shutdown and operation drain before normal SQLite close', () => {
              expect(source).toContain('operationsDrained: operations.drained');
              expect(source).toContain('shutdown.vectorSettled && shutdown.operationsDrained');
            });

            it('activates a database read-only barrier when operations outlive the bounded drain', () => {
              expect(source).toContain('if (!mayCloseDatabase) this.db.beginShutdownReadOnly();');
              expect(source).toContain('if (mayCloseDatabase) this.db.close();');
            });
          });
          """, encoding='utf-8')

          docs = Path('docs/phase0-closure.md')
          docs.write_text(docs.read_text(encoding='utf-8') + """

          ## Final runtime-admission closure

          Every renderer IPC request is admitted through one `ipc_request` operation token, so quiescing rejects new read or write work and shutdown can account for requests already in flight. Normal SQLite close now requires both vector shutdown and a drained operation tracker. If an uncooperative provider outlives the bounded drain, the runtime disables embedding/vector writes and switches SQLite to `query_only` instead of closing a database that may still be referenced. This preserves bounded shutdown while preventing late persistence.
          """, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run arch:check
      - run: npm run build
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "our-companion-phase0-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase0-finalize-direct.yml
          git add apps/desktop/electron/main/application/OperationTracker.ts \
            apps/desktop/electron/main/application/RuntimeIpcGate.ts \
            apps/desktop/electron/main/application/RuntimeIpcGate.test.ts \
            apps/desktop/electron/main/application/LifecycleWiring.test.ts \
            apps/desktop/electron/main/services.ts \
            apps/desktop/electron/main/index.ts \
            packages/database/src/index.ts \
            packages/database/src/shutdown-readonly.test.ts \
            docs/phase0-closure.md
          git commit -m "fix: finalize phase 0 runtime admission"
          git push origin HEAD:main
