name: Phase 0 PR finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/phase0-finalize') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic final patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f scripts/phase0-finalize.mjs ]; then
            echo "Finalizer already applied." | tee phase0-finalizer.log
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase0-finalize.mjs')
          source = path.read_text(encoding='utf-8')
          path.write_text(source.replace(r'\\`', r'\`'), encoding='utf-8')
          PY
          node scripts/phase0-finalize.mjs 2>&1 | tee phase0-finalizer.log
      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-finalizer-log
          path: phase0-finalizer.log
          if-no-files-found: error
      - name: Stop on patch failure
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Remove one-shot bootstrap files
        run: |
          rm -f \
            .github/workflows/phase0-finalize-direct.yml \
            .github/workflows/phase0-finalize.yml \
            .github/workflows/phase0-apply-only.yml \
            .github/workflows/phase0-pr-finalizer.yml \
            .github/workflows/phase0-pr-finalize.yml \
            scripts/phase0-finalize.mjs \
            .phase0-finalizer-trigger \
            .phase0-finalize-trigger \
            phase0-finalizer.log
      - name: Commit patch to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: close phase 0 lifecycle admission"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
