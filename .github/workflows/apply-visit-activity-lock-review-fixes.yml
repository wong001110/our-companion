name: Apply Visit Activity Lock Review Fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/visit-activity-lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visit-activity-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-visit-activity-lock-review-fixes.py
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run arch:check
      - run: npm run build
      - name: Remove one-time files
        run: |
          rm scripts/apply-visit-activity-lock-review-fixes.py
          rm .github/workflows/apply-visit-activity-lock-review-fixes.yml
      - name: Commit reviewed product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden Visit activity lock reconciliation"
          git push origin HEAD:agent/visit-activity-lock
