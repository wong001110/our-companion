name: Apply Discovery test adjustment

on:
  push:
    branches:
      - agent/fix-plain-turn-output
    paths:
      - scripts/adjust-discovery-prefilter-test.py
      - .github/workflows/run-discovery-test-adjustment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - run: python scripts/adjust-discovery-prefilter-test.py
      - run: |
          rm scripts/adjust-discovery-prefilter-test.py
          rm .github/workflows/run-discovery-test-adjustment.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: preserve bounded known-page probes"
          git push origin HEAD:agent/fix-plain-turn-output
