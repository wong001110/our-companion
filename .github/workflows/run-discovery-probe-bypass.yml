name: Apply Discovery probe bypass

on:
  push:
    branches:
      - agent/fix-plain-turn-output
    paths:
      - scripts/apply-discovery-probe-bypass.py
      - .github/workflows/run-discovery-probe-bypass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-plain-turn-output
          fetch-depth: 0
      - run: python scripts/apply-discovery-probe-bypass.py
      - run: |
          rm scripts/apply-discovery-probe-bypass.py
          rm .github/workflows/run-discovery-probe-bypass.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve bounded Discovery update probes"
          git push origin HEAD:agent/fix-plain-turn-output
