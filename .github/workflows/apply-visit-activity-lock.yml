name: Apply Visit Activity Lock

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/visit-activity-lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visit-activity-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch-visit-activity-lock-integration.py
      - run: python scripts/apply-visit-activity-lock.py
      - run: python scripts/patch-visit-activity-lock-types.py
      - run: python scripts/patch-visit-activity-lock-runtime-and-tests.py
      - run: python scripts/patch-visit-activity-lock-compatibility.py
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run arch:check
      - run: npm run build
      - name: Remove one-time integration files
        run: |
          rm scripts/patch-visit-activity-lock-integration.py
          rm scripts/patch-visit-activity-lock-types.py
          rm scripts/patch-visit-activity-lock-runtime-and-tests.py
          rm scripts/patch-visit-activity-lock-compatibility.py
          rm scripts/apply-visit-activity-lock.py
          rm .github/workflows/apply-visit-activity-lock.yml
      - name: Commit integrated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: lock Companion activity during Visit reservations"
          git push origin HEAD:agent/visit-activity-lock
